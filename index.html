<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Carta de Dia das Mães</title>
  <style>
    :root {
      --bg-1: #ffd7e2;
      --bg-2: #ffb6cc;
      --paper: #fff8f1;
      --envelope: #f8d6df;
      --envelope-dark: #efb9c8;
      --seal: #e84a77;
      --text: #5a2b3a;
      --shadow: 0 20px 35px rgba(90, 43, 58, 0.2);
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      font-family: "Segoe UI", Tahoma, Geneva, Verdana, sans-serif;
      color: var(--text);
      background: radial-gradient(circle at top, var(--bg-1), var(--bg-2));
    }

    .scene {
      width: min(92vw, 520px);
    }

    .letter-wrapper {
      position: relative;
      perspective: 1400px;
      padding-top: 12%;
    }

    .top-message {
      margin: 0;
      font-size: clamp(1.05rem, 2.6vw, 1.35rem);
      font-weight: 700;
      color: #7a2944;
      text-align: center;
      position: absolute;
      left: 50%;
      top: 2%;
      transform: translate(-50%, -100%);
      width: 100%;
    }

    .envelope {
      position: relative;
      width: 100%;
      aspect-ratio: 4 / 3;
      border-radius: 18px;
      background: linear-gradient(160deg, var(--envelope), var(--envelope-dark));
      box-shadow: var(--shadow);
      overflow: visible;
    }

    .envelope::before,
    .envelope::after {
      content: "";
      position: absolute;
      width: 100%;
      height: 100%;
      border-radius: 18px;
      pointer-events: none;
    }

    .envelope::before {
      clip-path: polygon(0 100%, 50% 48%, 100% 100%);
      background: #f6c7d5;
      z-index: 4;
    }

    .envelope::after {
      clip-path: polygon(0 0, 50% 50%, 100% 0, 100% 100%, 0 100%);
      border: 2px solid rgba(255, 255, 255, 0.35);
      z-index: 6;
    }

    .envelope-front {
      position: absolute;
      inset: 0;
      z-index: 7;
      display: grid;
      place-items: center;
      text-align: center;
      padding: 2rem;
    }

    .to-text {
      margin: 0 0 3.5rem;
      font-size: clamp(1.05rem, 2.5vw, 1.35rem);
      font-weight: 600;
    }

    .seal {
      position: relative;
      z-index: 20;
      border: none;
      width: 88px;
      height: 88px;
      border-radius: 50%;
      background: var(--seal);
      color: #fff;
      font-weight: 700;
      letter-spacing: 0.03em;
      cursor: pointer;
      box-shadow: 0 10px 24px rgba(232, 74, 119, 0.45);
      transition: transform 0.2s ease, filter 0.2s ease;
    }

    .seal:hover {
      transform: scale(1.06);
      filter: brightness(1.04);
    }

    .seal:active {
      transform: scale(0.98);
    }

    .envelope-flap {
      position: absolute;
      inset: 0;
      transform-origin: top center;
      clip-path: polygon(0 0, 50% 58%, 100% 0);
      background: linear-gradient(180deg, #f5c0d0, #eca7bc);
      z-index: 8;
      transition: transform 0.8s ease;
    }

    .card {
      position: absolute;
      left: 50%;
      top: 52%;
      width: 85%;
      padding: 1.4rem 1.25rem;
      border-radius: 14px;
      background: var(--paper);
      box-shadow: 0 12px 26px rgba(30, 14, 19, 0.18);
      transform: translate(-50%, 0) scaleY(0.1);
      transform-origin: bottom center;
      opacity: 0;
      z-index: 2;
      transition: transform 0.9s cubic-bezier(0.25, 0.8, 0.25, 1), opacity 0.6s ease;
    }

    .card h1 {
      margin: 0 0 0.7rem;
      font-size: clamp(1.2rem, 3.4vw, 1.65rem);
      color: #d53c67;
    }

    .card p {
      margin: 0;
      line-height: 1.5;
      font-size: clamp(0.97rem, 2.6vw, 1.06rem);
    }

    .envelope.open .envelope-flap {
      transform: rotateX(180deg);
    }

    .envelope.open .card {
      transform: translate(-50%, -44%) scaleY(1);
      opacity: 1;
      z-index: 9;
    }

    .envelope.open .seal {
      opacity: 0;
      pointer-events: none;
    }

    .envelope.open .to-text {
      opacity: 0.35;
    }

    @media (max-width: 420px) {
      .seal {
        width: 74px;
        height: 74px;
        font-size: 0.85rem;
      }
    }
  </style>
</head>
<body>
  <main class="scene">
    <section class="letter-wrapper">
      <p class="top-message">Com amor, para minha mãe.</p>
      <div id="envelope" class="envelope" aria-live="polite">
        <div class="envelope-front">
          <button id="seal" class="seal" aria-label="Abrir carta">Abrir</button>
        </div>

        <div class="envelope-flap"></div>

        <article id="card" class="card">
          <h1>Feliz Dia das Mães!</h1>
          <p>
            Parabéns pelo seu dia, e obrigado por ser a minha mãe tão boa.
          </p>
        </article>
      </div>
    </section>
  </main>

  <script>
    const envelope = document.getElementById("envelope");
    const seal = document.getElementById("seal");

    seal.addEventListener("click", () => {
      envelope.classList.add("open");
    });
  </script>
</body>
</html>
